[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energyhome"
version = "0.1.0"
description = "Energy Consumption Analysis System EnergyHome"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
energyhome = "energyhome.cli:main"
